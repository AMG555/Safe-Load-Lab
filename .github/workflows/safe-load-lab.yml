name: Safe Load Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  safe-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CLI
        run: npm install -g .
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run smoke test
        run: |
          sll run \
            --url https://www.google.com \
            --duration 10 \
            --concurrency 2 \
            --rps 3 \
            --i-own-this-target \
            --out reports/smoke-test.json \
            --html reports/smoke-test.html \
            --markdown reports/smoke-test.md
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-load-lab-reports
          path: reports