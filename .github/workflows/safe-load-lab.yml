name: Safe Load Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  safe-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CLI
        run: npm install -g .
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run controlled test with assertions
        run: |
          sll run \
            --config examples/with-assertions.json \
            --i-own-this-target \
            --out reports/test-report.json \
            --html reports/test-report.html \
            --markdown reports/test-report.md
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-load-lab-reports
          path: reports