name: Safe Load Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run all tests (unit, integration, performance, smoke, A/B, QA)
        run: npm run test:all

  safe-load-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install CLI globally
        run: npm install -g .
      - name: Create reports directory
        run: mkdir -p reports
      - name: Start hermetic mock server
        run: |
          sll mock --port 8080 &
          sleep 2
      - name: Run smoke load test against mock server
        run: |
          sll run \
            --url http://127.0.0.1:8080/fast \
            --duration 5 \
            --concurrency 2 \
            --rps 5 \
            --i-own-this-target \
            --out reports/smoke-test.json \
            --html reports/smoke-test.html \
            --markdown reports/smoke-test.md
      - name: Run A/B differential load test
        run: |
          sll ab \
            --url-a http://127.0.0.1:8080/fast \
            --url-b http://127.0.0.1:8080/slow?delay=40 \
            --duration 5 \
            --concurrency 2 \
            --rps 5 \
            --max-latency-diff 300 \
            --i-own-this-target \
            --out reports/ab-test.json \
            --html reports/ab-test.html \
            --markdown reports/ab-test.md
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-load-lab-reports
          path: reports